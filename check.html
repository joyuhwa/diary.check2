<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상태 선택</title>

<style>

body{
    font-family:Arial;
    padding:40px;
    background:#f5f7fb;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:22px;
    margin:18px 0;
    cursor:pointer;

    padding:10px 15px;
    border-radius:10px;
    width:fit-content;
}

.writing{
    background:#ffe867;
}

.photo_plus{
    background:#ffe867;
}

.main_photo{
    background:#ffe867;
}


/* 날짜 이동 */

#dateNav{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

#dateNav h2{
    margin:0;
}

#dateNav button{
    border:none;
    background:white;
    width:40px;
    height:40px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
}


/* 메모 */

#memo{
    width:100%;
    max-width:500px;
    min-height:100px;

    padding:14px;
    margin-bottom:25px;

    border:1px solid #ddd;
    border-radius:12px;

    background:white;

    font-family:Arial, sans-serif;
    font-size:18px;

    resize:vertical;
    outline:none;
}

#memo:focus{
    border-color:#aaa;
}

#memo::placeholder{
    color:#aaa;
}

</style>
</head>

<body>


<div id="dateNav">
    <button id="prevDay">◀</button>
    <h2 id="title"></h2>
    <button id="nextDay">▶</button>
</div>


<!-- 메모 -->

<textarea
    id="memo"
    placeholder="메모를 입력하세요..."
></textarea>


<!-- 체크박스 -->

<label class="writing">
    <input type="checkbox" value="writing"> 글쓰기
</label>

<label class="photo_plus">
    <input type="checkbox" value="photo_plus"> 사진 추가
</label>

<label class="main_photo">
    <input type="checkbox" value="main_photo"> 대표 사진
</label>


<script>

const params = new URLSearchParams(location.search);
const date = params.get("date");

let currentDate = new Date(date + "T00:00:00");


// 날짜 문자열 만들기

function getDateString(){

    const year = currentDate.getFullYear();
    const month = String(currentDate.getMonth() + 1).padStart(2,"0");
    const day = String(currentDate.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


// 날짜 표시 + 체크 + 메모 불러오기

function updateDate(){

    const dateString = getDateString();

    document.getElementById("title").innerText = dateString;

    loadCheck(dateString);
    loadMemo(dateString);

    // 주소창의 date도 변경
    history.replaceState(
        null,
        "",
        `check.html?date=${dateString}`
    );

}


// 체크 상태 불러오기

function loadCheck(dateString){

    const key = "check_" + dateString;

    const saved = JSON.parse(
        localStorage.getItem(key) || "[]"
    );

    document.querySelectorAll(
        'input[type="checkbox"]'
    ).forEach(checkbox => {

        checkbox.checked = saved.includes(
            checkbox.value
        );

    });

}


// 메모 불러오기

function loadMemo(dateString){

    const key = "memo_" + dateString;

    const savedMemo =
        localStorage.getItem(key) || "";

    document.getElementById("memo").value =
        savedMemo;

}


// 체크 상태 저장

document.querySelectorAll(
    'input[type="checkbox"]'
).forEach(checkbox => {

    checkbox.addEventListener("change", () => {

        const dateString = getDateString();

        const key = "check_" + dateString;

        const checked = Array.from(
            document.querySelectorAll(
                'input[type="checkbox"]:checked'
            )
        ).map(input => input.value);

        localStorage.setItem(
            key,
            JSON.stringify(checked)
        );

    });

});


// 메모 자동 저장

document.getElementById("memo").addEventListener(
    "input",
    () => {

        const dateString = getDateString();

        const key = "memo_" + dateString;

        localStorage.setItem(
            key,
            document.getElementById("memo").value
        );

    }
);


// 이전 날짜

document.getElementById("prevDay").onclick = () => {

    currentDate.setDate(
        currentDate.getDate() - 1
    );

    updateDate();

};


// 다음 날짜

document.getElementById("nextDay").onclick = () => {

    currentDate.setDate(
        currentDate.getDate() + 1
    );

    updateDate();

};


// 처음 열었을 때

updateDate();

</script>

</body>
</html>
